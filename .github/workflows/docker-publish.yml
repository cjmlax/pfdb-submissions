name: Build and publish image

# Images are only built for semver release tags (e.g. 1.2.3 or 1.3.0-rc.1;
# a leading "v" is also accepted).
# Plain commits to main no longer produce an image.
#
# Tags pushed for a stable release (X.Y.Z):
#   X.Y.Z   exact, immutable — pin this in compose
#   X.Y     moves to the newest patch of that minor
#   X       moves to the newest minor/patch of that major (skipped for 0.x)
#   latest  moves to the newest stable release
#   sha-xxxxxxx  traceability back to the commit
#
# Pre-releases (X.Y.Z-rc.N, -beta.N, ...) only get their exact tag + sha,
# so they never move latest / X.Y / X.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:        # rebuild an existing tag: pick it in the "Use workflow from" dropdown

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # required to push to GHCR
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow against an X.Y.Z release tag, not a branch."
          exit 1

      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: only applied to stable (non-prerelease) semver tags
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, '0.') && !startsWith(github.ref_name, 'v0.') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
