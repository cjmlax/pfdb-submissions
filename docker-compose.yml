services:
  pfdb-submissions:
    image: ghcr.io/cjmlax/pfdb-submissions:latest
    container_name: pfdb-submissions
    restart: unless-stopped
    env_file: .env
    volumes:
      - pfdb-submissions-data:/data
    networks:
      - nginx_proxy_network
    # No published ports — Nginx Proxy Manager reaches it over the shared
    # nginx_proxy_network by container name (pfdb-submissions:8080).

volumes:
  pfdb-submissions-data:

networks:
  nginx_proxy_network:
    external: true
